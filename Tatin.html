        body {
            background-color: #010102;

            overflow-x: hidden;
        }
        .gothic-font {
            font-family: 'Cinzel Decorative', serif;
            letter-spacing: 2px;
        }
        .glass-card {
            background: rgba(8, 8, 12, 0.95);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 0, 0, 0.6);
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 1), 0 0 60px rgba(255, 0, 0, 0.35);
        }
        .glass-card:hover {
            border-color: rgba(255, 0, 0, 0.9);
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 1), 0 0 80px rgba(255, 0, 0, 0.5);
        }
        .fiery-border {
            background: linear-gradient(135deg, #ff0000, #990000, #220000);
            animation: demonic-pulse 1.2s infinite alternate;
        }
        @keyframes demonic-pulse {
            0% { box-shadow: 0 0 25px rgba(255, 0, 0, 0.7), inset 0 0 15px rgba(255, 0, 0, 0.5); }
            100% { box-shadow: 0 0 55px rgba(255, 0, 0, 1), inset 0 0 25px rgba(255, 0, 0, 0.8); }
        }
        .vignette {
            background: radial-gradient(circle, rgba(0,0,0,0.2) 10%, rgba(1,1,2,0.98) 85%);
        }
        input[type="range"] {
            accent-color: #ff0000;
        }
    </style>
</head>

                <span class="text-[10px] font-black uppercase tracking-widest bg-red-950/80 text-red-400 border border-red-600 px-4 py-1.5 rounded-full shadow-[0_0_15px_rgba(255,0,0,0.5)]">CHEATER</span>

        <div class="glass-card rounded-2xl p-4 shadow-2xl flex items-center gap-4 border-red-600/50">
            <div class="w-20 h-20 rounded-xl overflow-hidden flex-shrink-0 border border-red-600/60 relative shadow-[0_0_20px_rgba(255,0,0,0.5)]">
                <img src="https://cdn.discordapp.com/attachments/1425724046850523218/1426171864740528128/new_m_gif.gif?ex=6a936d4d&is=6a921bcd&hm=e2a42079d6c2258eb618391a8fcb627417626d463934278367d9d9e0f2ec6fe9&" class="w-full h-full object-cover" alt="Track Art">
            </div>

            <div class="flex-1 flex flex-col justify-center overflow-hidden">
                <div class="flex justify-between items-center mb-1.5">
                    <span id="track-title" class="gothic-font text-xs font-bold text-red-500 truncate tracking-wider drop-shadow-[0_0_8px_rgba(255,0,0,0.8)]">Maligno</span>
                    <span id="time-display" class="text-[10px] text-red-400 font-mono">0:00 / 0:00</span>
                </div>

                <input type="range" id="progress-bar" value="0" max="100" class="w-full h-1 bg-zinc-900 rounded-lg appearance-none cursor-pointer mb-2.5">

                <div class="flex items-center justify-between">
                    <button id="play-pause-btn" class="text-xs bg-red-950/80 hover:bg-red-900 text-red-300 border border-red-600/70 px-3.5 py-1.5 rounded-lg transition font-bold flex items-center gap-1.5 shadow-[0_0_12px_rgba(255,0,0,0.4)]">
                        ▶ Play Audio
                    </button>
                    <button id="mute-btn" class="text-xs text-zinc-400 hover:text-red-400 transition font-bold">
                        🔊 Mute
                    </button>
                </div>
            </div>
        </div>

    </div>

    <script>
        const splashScreen = document.getElementById('splash-screen');
        const bgAudio = document.getElementById('bg-audio');
        const playPauseBtn = document.getElementById('play-pause-btn');
        const progressBar = document.getElementById('progress-bar');
        const timeDisplay = document.getElementById('time-display');
        const muteBtn = document.getElementById('mute-btn');

        function enterSite() {
            splashScreen.style.opacity = '0';
            setTimeout(() => {
                splashScreen.style.display = 'none';
            }, 700);

            bgAudio.play().then(() => {
                playPauseBtn.textContent = '⏸ Pause';
            }).catch(error => {
                console.log("Audio autoplay restricted: ", error);
            });
        }

        splashScreen.addEventListener('click', enterSite);
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                enterSite();
            }
        });

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        bgAudio.addEventListener('loadedmetadata', () => {
            progressBar.max = bgAudio.duration;
            timeDisplay.textContent = `0:00 / ${formatTime(bgAudio.duration)}`;
        });

        bgAudio.addEventListener('timeupdate', () => {
            progressBar.value = bgAudio.currentTime;
            timeDisplay.textContent = `${formatTime(bgAudio.currentTime)} / ${formatTime(bgAudio.duration || 0)}`;
        });

        playPauseBtn.addEventListener('click', () => {
            if (bgAudio.paused) {
                bgAudio.play();
                playPauseBtn.textContent = '⏸ Pause';
            } else {
                bgAudio.pause();
                playPauseBtn.textContent = '▶ Play Audio';
            }
        });

        progressBar.addEventListener('input', () => {
            bgAudio.currentTime = progressBar.value;
        });

        muteBtn.addEventListener('click', () => {
            bgAudio.muted = !bgAudio.muted;
            muteBtn.textContent = bgAudio.muted ? '🔇 Unmute' : '🔊 Mute';
        });
    </script>
</body>
</html>
